name: Build cloud POS frontend
on:
  push:
    branches: [codex/hfm-recovery-owner]
    paths:
      - frontend/**
      - .github/workflows/cloud-sign-in.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_API_BASE_URL: /api
          REACT_APP_BADIZO_CLOUD_BUILD: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-pos-frontend-${{ github.sha }}
          path: frontend/build/
          if-no-files-found: error
